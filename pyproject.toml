[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-searxng-mcp-server"
dynamic = ["version"]
description = "Open-source MCP server for SearXNG metasearch with VectorRAG reranking, audio transcription (FasterWhisper), and multi-format document support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Sheldon Robinson"}
]
keywords = ["mcp", "searxng", "search", "metasearch", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Local searxng submodule with Windows patches
    "searxng-engine",
    "flask",
    "waitress",
    "uvicorn",
    "starlette",
    "sse-starlette",
    "anyio",
    "pydantic",
    "aiohttp",
    "beautifulsoup4",
    "trafilatura>=2.0,<2.1; python_version < '3.10'",
    "trafilatura>=2.0,<3; python_version >= '3.10'",
    "pyyaml",
    "platformdirs",
    "mcp",
    "mcp-utils",
    "strif",
    "queuelib",
    "lancedb>=0.16",
    "numpy",
]

[project.optional-dependencies]
embeddings = [
    "openai",
    "ctranslate2>=4.5,<4.6; python_version < '3.9'",
    "ctranslate2>=4.5,<5; python_version >= '3.9'",
    "huggingface-hub>=0.26,<1; python_version < '3.9'",
    "huggingface-hub>=0.26; python_version >= '3.9'",
    "transformers>=4.46,<4.47; python_version < '3.9'",
    "transformers>=4.46,<5; python_version >= '3.9'",
]
markitdown = [
    "markitdown",
]
all-formats = [
    "markitdown",
    "faster-whisper",
]
pptx = [
    "markitdown[pptx]",
]
docx = [
    "markitdown[docx]",
]
xlsx = [
    "markitdown[xlsx]",
]
xls = [
    "markitdown[xls]",
]
pdf = [
    "markitdown[pdf]",
]
outlook = [
    "markitdown[outlook]",
]
audio-transcription = [
    "markitdown[audio-transcription]",
    "SpeechRecognition[faster-whisper]",
]
youtube-transcription = [
    "markitdown[youtube-transcription]",
]
all = [
    "openai",
    "ctranslate2>=4.5,<4.6; python_version < '3.9'",
    "ctranslate2>=4.5,<5; python_version >= '3.9'",
    "huggingface-hub>=0.26,<1; python_version < '3.9'",
    "huggingface-hub>=0.26; python_version >= '3.9'",
    "transformers>=4.46,<4.47; python_version < '3.9'",
    "transformers>=4.46,<5; python_version >= '3.9'",
    "markitdown[all]",
    "faster-whisper",
    "SpeechRecognition[faster-whisper]",
]

[project.urls]
Homepage = "https://github.com/sheldonrobinson/easy-searxng-mcp-server"
Documentation = "https://github.com/sheldonrobinson/easy-searxng-mcp-server#readme"
Repository = "https://github.com/sheldonrobinson/easy-searxng-mcp-server.git"
Issues = "https://github.com/sheldonrobinson/easy-searxng-mcp-server/issues"

[project.scripts]
easy-searxng-mcp-server = "main:main"
easy-searxng-download-models = "common.post_install_model:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false

[tool.setuptools.package-data]
easy_searxng_mcp_server = ["models/**/*"]
"runner.settings" = ["*.yml"]

[tool.uvx]
default-groups = ["main"]
